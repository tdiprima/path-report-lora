[project]
name = "path-report-lora"
version = "0.1.0"
description = "LoRA fine-tuning demo that teaches Qwen2.5 to extract JSON from pathology reports, with before/after eval and Ollama export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.6.0",
    "numpy==1.26.4",
    "peft==0.15.2",
    # 2.2.2 is the last torch for Intel Macs. PyPI's ARM Linux torch is CPU-only,
    # so ARM Linux gets a CUDA build from the PyTorch index (see tool.uv.sources).
    "torch==2.2.2; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torch==2.9.1+cu126; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "transformers==4.51.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
